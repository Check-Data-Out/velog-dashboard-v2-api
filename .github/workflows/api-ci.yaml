name: API CI

on:
  workflow_dispatch:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 21, 22, 23]
      fail-fast: false # 한 버전 실패 시 전체 중단 방지

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "store-path=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.store-path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env file
        # 특수문자('#' 등)가 있는 값은 dotenv 가 인라인 주석으로 잘라내므로 따옴표로 감싼다 (.env.sample 참고)
        run: |
          echo "SLACK_WEBHOOK_URL='${{ secrets.SLACK_WEBHOOK_URL }}'" >> .env
          echo "SENTRY_CLIENT_SECRET='${{ secrets.SENTRY_CLIENT_SECRET }}'" >> .env
          echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" >> .env
          # AES 키들 추가 (테스트용 더미 키)
          echo "AES_KEY_0=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" >> .env
          echo "AES_KEY_1=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb" >> .env
          echo "AES_KEY_2=cccccccccccccccccccccccccccccccc" >> .env
          echo "AES_KEY_3=dddddddddddddddddddddddddddddddd" >> .env
          echo "AES_KEY_4=eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee" >> .env
          echo "AES_KEY_5=ffffffffffffffffffffffffffffffff" >> .env
          echo "AES_KEY_6=gggggggggggggggggggggggggggggggg" >> .env
          echo "AES_KEY_7=hhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhh" >> .env
          echo "AES_KEY_8=iiiiiiiiiiiiiiiiiiiiiiiiiiiiiiii" >> .env
          echo "AES_KEY_9=jjjjjjjjjjjjjjjjjjjjjjjjjjjjjjjj" >> .env

      - name: Run lint
        run: pnpm run lint

      - name: Run tests
        run: pnpm run test

      - name: Run build
        run: pnpm run build

  # 통합 테스트는 운영 DB 가 아니라 job 안의 빈 Postgres 에서만 돈다.
  # 스키마는 테이블을 관리하는 back-office 의 Django 마이그레이션으로 만든다.
  integration:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vd2
          POSTGRES_PASSWORD: vd2
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout back-office
        uses: actions/checkout@v7
        with:
          repository: Check-Data-Out/velog-dashboard-v2-back-office
          ref: main
          path: back-office
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Poetry
        uses: abatilo/actions-poetry@v4
        with:
          poetry-version: 1.8.4

      - name: Back-office migrate
        working-directory: back-office
        run: |
          poetry config virtualenvs.in-project true --local
          poetry install --with dev --no-root
          echo "SECRET_KEY=ci-only-secret" >> .env
          echo "DATABASE_ENGINE=django.db.backends.postgresql" >> .env
          echo "DATABASE_NAME=postgres" >> .env
          echo "POSTGRES_USER=vd2" >> .env
          echo "POSTGRES_PASSWORD=vd2" >> .env
          echo "POSTGRES_HOST=localhost" >> .env
          echo "POSTGRES_PORT=5432" >> .env
          poetry run python manage.py migrate --noinput

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run integration tests
        # 테스트의 SSL 분기는 POSTGRES_HOST 가 정확히 localhost 일 때만 꺼진다
        env:
          DATABASE_NAME: postgres
          POSTGRES_USER: vd2
          POSTGRES_PASSWORD: vd2
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: pnpm run test:integration
