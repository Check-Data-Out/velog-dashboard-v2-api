user  nginx;
worker_processes  1;

pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # access_token / refresh_token header
    underscores_in_headers on;

    log_format main  '{"@time":"$time_iso8601",'
                '"IP":"$remote_addr",'
                '"Status":$status,'
                '"Method":"$request_method",'
                '"RequestTime":$request_time,'
                '"URI":"$request_uri",'
                '"QueryString":"$query_string",'
                '"SentSize":$bytes_sent,'
                '"UA":"$http_user_agent",'
                '"Session":"$http_authorization",'
                '"Referer":"$http_referer"}';

    # charset koi8-r;
    access_log  /var/log/nginx/access.log  main;
    error_log /var/log/nginx/error.log warn;

    # client send request size
    client_max_body_size 3G;

    # LB 와 SSR 요청이 거쳐 오는 서버의 IP 는 공개 레포에 두지 않고 서버의 nginx/trusted-proxies/*.conf 에
    # set_real_ip_from 으로 적는다. 파일이 없으면 모든 요청의 접속 IP 가 LB 로 보인다
    set_real_ip_from 127.0.0.1;
    include /etc/nginx/trusted-proxies/*.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;

    #security
    server_tokens off;
}
